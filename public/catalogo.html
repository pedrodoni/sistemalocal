<!DOCTYPE html>
<html lang="es">

</head>

<body class="catalogo">

  <div class="header">
    <a href="index.html">⬅ Home</a>

    <table class="tabla-precios">

      </table>
    </div>
</div>
 
<button id="logout">Cerrar sesión</button>
