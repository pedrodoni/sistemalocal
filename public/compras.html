<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Compras</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="productos">

<div class="header">
  <a href="index.html">⬅ Home</a>
  <h1>🧾 Compras / Reposición</h1>
</div>

<div class="contenedor">

  <div class="card">
    <h2>Cargar compra</h2>

    <div class="form-grid">
      <input id="distribuidor" placeholder="Distribuidor">
      <input id="fecha" type="date">
      <input id="monto" type="number" placeholder="Monto">
    </div>

    <button id="guardar" class="btn">Guardar compra</button>
  </div>

  <div class="crrd">
    <h2>Historial de compras</h2>

    <ul id="listaCompras" class="lista-productos"></ul>

  </div>
    <h3>Total gastado: $<span id="total">0</span></h3>

</div>

<script type="module" src="compras.js"></script>
</body>
</html>
