<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nueva venta</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="venta">

<div class="header">
  <a href="index.html">⬅ Home</a>
  <h1>🛒 Nueva venta</h1>
</div>

<div class="contenedor">

  <div class="card calculadora-vuelto">
    <h3>🧮 Calculadora de vuelto</h3>

    <div class="calculadora-fila">
      <div class="calc-campo">
        <label>Monto</label>
        <input type="number" id="calcMonto" placeholder="$0">
      </div>

      <div class="calc-campo">
        <label>Pago con</label>
        <input type="number" id="calcPago" placeholder="$0">
      </div>

      <div class="calc-resultado">
        <span>Vuelto</span>
        <strong>$<span id="calcVuelto">0</span></strong>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 class="titulo-seccion">🛍️ Carrito</h2>

    <input id="cliente" class="input-full" placeholder="Nombre del comprador (opcional)">

    <ul id="carrito" class="lista-carrito"></ul>

    <div class="fila-descuento">
      <label>Descuento: $</label>
      <input type="number" id="descuento" value="0" min="0">
    </div>

    <div class="pago" id="pagoSimple">
      <label class="pago-titulo">Medio de pago</label>

      <div class="pago-opciones">
        <label class="opcion-pago">
          <input type="radio" name="medioPago" value="efectivo" checked>
          💵 Efectivo
        </label>

        <label class="opcion-pago">
          <input type="radio" name="medioPago" value="posnet">
          💳 POSNET
        </label>

        <label class="opcion-pago">
          <input type="radio" name="medioPago" value="trsf_dany">
          📲 Transferencia Dany
        </label>

        <label class="opcion-pago">
          <input type="radio" name="medioPago" value="trsf_ana">
          📲 Transferencia Ana
        </label>
      </div>
    </div>

    <label class="switch-dividido">
      <input type="checkbox" id="pagoDividido">
      🔀 Dividir el pago entre varios medios
    </label>

    <div id="pagoDivididoBox" class="pago-dividido-box" style="display:none;">
      <div id="listaPagosDivididos"></div>

      <button type="button" id="agregarMedioPago" class="btn-secundario">➕ Agregar medio de pago</button>

      <div id="resumenPagoDividido" class="resumen-pago-dividido">
        Asignado: $0 de $0
      </div>
    </div>

    <div class="total-final">
      Total final: <strong>$<span id="totalFinal">0</span></strong>
    </div>

    <button id="confirmar" class="btn btn-confirmar">Confirmar venta</button>
  </div>

  <div class="card">
    <h2>➕ Producto suelto</h2>

    <div class="fila-suelto">
      <input id="sueltoNombre" placeholder="Nombre">
      <input id="sueltoPrecio" type="number" placeholder="Precio">
      <input id="sueltoCantidad" type="number" min="1" value="1">
      <button id="agregarSuelto" class="btn-secundario">Agregar al carrito</button>
    </div>
  </div>

  <div class="card">
    <h2>Productos disponibles</h2>

    <div class="filtros">
      <input id="buscar" placeholder="Buscar">
      <input id="buscarCodigo" placeholder="Código de barras">
      <select id="categoria">
        <option value="">Todas</option>
      </select>
    </div>

    <ul id="productos"></ul>
  </div>

</div>

<script type="module" src="venta.js"></script>
</body>
</html>
